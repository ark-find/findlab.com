kind = "web"
previewPath = "/"
title = "FIND Lab"
version = "1.0.0"
id = "artifacts/find-lab"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18344

[services.development]
run = "pnpm --filter @workspace/find-lab run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/find-lab", "run", "build" ]
publicDir = "artifacts/find-lab/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18344"
BASE_PATH = "/"
